name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Frontend (tipos e build)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Vet
        run: go vet ./...
      - name: Testes, com detector de corridas
        run: go test -race -count=1 ./...
